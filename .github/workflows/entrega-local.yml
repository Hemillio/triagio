
name: Entrega contínua - pacote local

on:
  workflow_run:
    workflows:
      - Testes automatizados - Triagio
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

jobs:
  pacote:
    name: Gerar e validar pacote da versão aprovada
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository

    runs-on: ubuntu-latest

    steps:
      - name: Baixar commit aprovado pela CI
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Configurar Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Gerar pacote ZIP do Triagio
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          mkdir -p dist
          short_sha="${SOURCE_SHA:0:12}"

          git archive \
            --format=zip \
            --prefix="triagio-${short_sha}/" \
            --output="dist/triagio-${short_sha}.zip" \
            "$SOURCE_SHA" \
            app migrations config.py run.py requirements.txt .env.example

      - name: Validar pacote em ambiente limpo
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p validacao
          unzip -q dist/triagio-*.zip -d validacao
          cd validacao/triagio-*

          echo "Verificando arquivos sensiveis..."
          test ! -e .env
          test ! -e instance
          test ! -e .venv

          echo "Criando ambiente virtual..."
          python -m venv .venv

          echo "Instalando dependencias..."
          .venv/bin/python -m pip install -r requirements.txt

          echo "Configurando ambiente temporario..."
          export TRIAGIO_SECRET_KEY="$(.venv/bin/python -c 'import secrets; print(secrets.token_hex(32))')"
          export TRIAGIO_DATABASE_URL="sqlite:///triagio.db"
          export FLASK_DEBUG=0

          echo "Aplicando migracoes..."
          .venv/bin/python -m flask --app run.py db upgrade

          test -f instance/triagio.db

          echo "Validando Flask internamente..."
          .venv/bin/python -c "from run import app; r=app.test_client().get('/'); assert r.status_code == 200, f'HTTP {r.status_code}'; print('Teste interno: HTTP 200 OK')"

          echo "Iniciando servidor local sem debug..."
          .venv/bin/python -m flask --app run.py run \
            --host 127.0.0.1 \
            --port 5056 \
            --no-debugger \
            --no-reload \
            --without-threads > flask.log 2>&1 &

          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          echo "Verificando resposta HTTP..."
          for tentativa in {1..15}; do
            if curl --fail --silent --max-time 2 \
              --output /dev/null http://127.0.0.1:5056/; then
              echo "Validacao HTTP 200 OK!"
              exit 0
            fi

            if ! kill -0 "$server_pid" 2>/dev/null; then
              break
            fi

            sleep 1
          done

          echo "Falha na verificacao HTTP."
          cat flask.log
          exit 1

      - name: Publicar somente pacote validado
        uses: actions/upload-artifact@v7
        with:
          name: triagio-${{ github.event.workflow_run.head_sha }}
          path: dist/triagio-*.zip
          if-no-files-found: error
          retention-days: 7
