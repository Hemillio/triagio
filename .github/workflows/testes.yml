name: Testes automatizados - Triagio

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  testes:
    name: Executar testes do Triagio

    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Configurar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Executar testes automatizados
        run: python -m pytest -q

  pacote:
    name: Validar pacote local para demonstracao
    needs: testes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o mesmo commit aprovado pela CI
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Configurar Python da validacao
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"

      - name: Montar ZIP somente com arquivos permitidos
        run: |
          set -euo pipefail
          mkdir -p dist
          short_sha="${GITHUB_SHA:0:12}"
          git archive --format=zip \
            --prefix="triagio-${short_sha}/" \
            --output="dist/triagio-${short_sha}.zip" \
            "$GITHUB_SHA" \
            app migrations config.py run.py requirements.txt README.md .env.example

      - name: Extrair e validar o pacote em pasta limpa
        env:
          VALIDATION_DIR: ${{ runner.temp }}/triagio-validation
        run: |
          set -euo pipefail
          mkdir -p "$VALIDATION_DIR/extracted"
          short_sha="${GITHUB_SHA:0:12}"
          archive="$(pwd)/dist/triagio-${short_sha}.zip"

          while IFS= read -r path; do
            case "$path" in
              "triagio-${short_sha}/"|"triagio-${short_sha}/app/"*|"triagio-${short_sha}/migrations/"*|"triagio-${short_sha}/config.py"|"triagio-${short_sha}/run.py"|"triagio-${short_sha}/requirements.txt"|"triagio-${short_sha}/README.md"|"triagio-${short_sha}/.env.example") ;;
              *) echo "Arquivo fora da lista permitida no ZIP: $path" >&2; exit 1 ;;
            esac

            if [[ "$path" != "triagio-${short_sha}/.env.example" && "$path" =~ (^|/)\.env($|[./])|(^|/)(instance|\.venv|__pycache__|\.pytest_cache|uploads|laudos)(/|$)|\.(db|sqlite[0-9]*(-wal|-shm)?|log|pdf|pem|key)$ ]]; then
              echo "O ZIP contém arquivos locais ou sensíveis: $path" >&2
              exit 1
            fi
          done < <(unzip -Z1 "$archive")

          unzip -q "$archive" -d "$VALIDATION_DIR/extracted"
          cd "$VALIDATION_DIR/extracted/triagio-${short_sha}"

          python -m venv "$VALIDATION_DIR/venv"
          source "$VALIDATION_DIR/venv/bin/activate"
          python -m pip install --disable-pip-version-check -r requirements.txt

          export TRIAGIO_SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          export TRIAGIO_DATABASE_URL="sqlite:///$VALIDATION_DIR/triagio-validation.db"
          flask --app run.py db upgrade

          flask --app run.py run --host 127.0.0.1 --port 5000 --no-debugger --no-reload > "$VALIDATION_DIR/flask.log" 2>&1 &
          server_pid=$!
          cleanup() {
            status=$?
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
            if [ "$status" -ne 0 ] && [ -f "$VALIDATION_DIR/flask.log" ]; then
              cat "$VALIDATION_DIR/flask.log"
            fi
            exit "$status"
          }
          trap cleanup EXIT

          for attempt in $(seq 1 30); do
            if curl --silent --show-error --fail http://127.0.0.1:5000/ -o /dev/null; then
              echo "Pacote extraído, migrações e rota inicial validados."
              exit 0
            fi
            sleep 1
          done
          echo "A aplicação não respondeu em http://127.0.0.1:5000/." >&2
          exit 1

      - name: Publicar Artifact validado
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: triagio-${{ github.sha }}
          path: dist/triagio-*.zip
          if-no-files-found: error
          retention-days: 7
